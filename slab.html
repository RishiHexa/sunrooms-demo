<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slab Cross-Section</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9ecef;
        font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
        color: #1f2328;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      .label-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .callout {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        font-style: italic;
        color: #2b2f36;
        white-space: nowrap;
        text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      }
      .callout::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #d0202a;
        flex: 0 0 auto;
      }
      .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 250px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #dde1e6;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .panel h1 {
        font-size: 14px;
        margin: 0 0 4px;
        color: #c0141e;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .panel p {
        margin: 0 0 10px;
        color: #6b7280;
        line-height: 1.4;
      }
      .panel label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .panel input[type='range'] {
        width: 110px;
      }
      .panel .val {
        width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .panel button {
        margin-top: 8px;
        width: 100%;
        height: 30px;
        border: none;
        border-radius: 5px;
        background: #2c4770;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .panel button.secondary {
        background: #eef0f3;
        color: #2c4770;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="panel">
      <h1>Slab cross-section</h1>
      <p>Embossed fiberglass slab, foam core, wood lock stile. Illustrative dimensions — not product data.</p>
      <label>Thickness <input id="thickness" type="range" min="1.375" max="2.25" step="0.125" value="1.75" /><span class="val" id="thickness-v"></span></label>
      <label>Skin <input id="skin" type="range" min="0.04" max="0.12" step="0.005" value="0.07" /><span class="val" id="skin-v"></span></label>
      <label>Emboss depth <input id="emboss" type="range" min="0" max="2" step="0.05" value="1" /><span class="val" id="emboss-v"></span></label>
      <label>Emboss back skin <input id="back" type="checkbox" checked /></label>
      <label>Callouts <input id="labels" type="checkbox" checked /></label>
      <button id="export">Download GLB</button>
      <button id="reset" class="secondary">Reset view</button>
    </div>
    <script type="module" src="/src/slab/main.js"></script>
  </body>
</html>
